[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydynamo"
version = "0.3.0"
description = "DYNAM-O sleep EEG analysis (TF-peaks, SO-power/phase histograms, fits) from Python, computed by the shared Rust kernel"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pandas>=2.0",
    # The Rust kernel computes every number pydynamo produces.
    "dynamo_rs>=0.2.2",
    # Canonical output-tree writers (pydynamo.io).
    "tifffile>=2023.7.10",
    "h5py>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydynamo = ["py.typed", "_cmap_*.npy"]
